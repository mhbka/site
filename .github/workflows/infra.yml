name: Infrastructure

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'blog/**'

  terraform:
    name: Terraform plan or apply
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.instance.outputs.instance_ip }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.S3_REGION }}
      AWS_ENDPOINT_URL_S3: ${{ vars.S3_ENDPOINT }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_instance_name: ${{ vars.DIGITALOCEAN_INSTANCE_NAME }}
      TF_VAR_digitalocean_region: ${{ vars.DIGITALOCEAN_REGION }}
      TF_VAR_digitalocean_droplet_size: ${{ vars.DIGITALOCEAN_DROPLET_SIZE }}
      TF_VAR_digitalocean_image: ${{ vars.DIGITALOCEAN_IMAGE }}
      TF_VAR_ssh_public_key: ${{ secrets.INSTANCE_SSH_PUBLIC_KEY }}
      TF_VAR_api_subdomain: ${{ vars.API_SUBDOMAIN }}
      TF_VAR_cloudflare_proxied: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read Droplet IP
        id: instance
        if: github.event_name == 'push'
        working-directory: infra
        run: echo "instance_ip=$(terraform output -raw instance_ipv4)" >> "$GITHUB_OUTPUT"

  prepare-deployment:
    name: Prepare application deployment
    if: github.event_name == 'push' && needs.terraform.result == 'success'
    needs: terraform
    runs-on: ubuntu-latest
    env:
      INSTANCE_IP: ${{ needs.terraform.outputs.instance_ip }}
      DROPLET_SSH_USER: ${{ vars.DIGITALOCEAN_SSH_USER }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

    steps:
      - uses: actions/checkout@v4

      - name: Write deployment SSH key
        env:
          INSTANCE_SSH_PRIVATE_KEY: ${{ secrets.INSTANCE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s' "$INSTANCE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"

      - name: Install Docker and prepare deployment directory
        run: |
          for attempt in {1..30}; do
            if ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DROPLET_SSH_USER@$INSTANCE_IP" \
              'sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 ufw && sudo systemctl enable --now docker && sudo usermod -aG docker "$USER" && sudo ufw allow OpenSSH && sudo ufw allow 80/tcp && sudo ufw allow 443/tcp && sudo ufw --force enable && sudo install -d -o "$USER" -g "$USER" -m 0755 /opt/site'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Synchronize application files
        run: >-
          rsync -az --delete
          --exclude='.git'
          --exclude='.github'
          --exclude='node_modules'
          --exclude='target'
          --exclude='dist'
          --exclude='.astro'
          --exclude='.terraform'
          --exclude='.env'
          --exclude='**/.env'
          -e "ssh -i $RUNNER_TEMP/ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ./ "$DROPLET_SSH_USER@$INSTANCE_IP:/opt/site/"

      - name: Write deployment environment files
        run: |
          printf '%s\n' "$BACKEND_ENV" \
            | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DROPLET_SSH_USER@$INSTANCE_IP" 'umask 077 && tee /opt/site/backend/.env > /dev/null'

  build-backend:
    name: Build backend image
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend image
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    env:
      BLOG_ENV: ${{ secrets.BLOG_ENV }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Write frontend build environment
        run: printf '%s\n' "$BLOG_ENV" > blog/.env

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./blog
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  start-compose:
    name: Start application and Caddy
    needs:
      - changes
      - terraform
      - prepare-deployment
      - build-backend
      - build-frontend
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        needs.terraform.result == 'success' &&
        needs.prepare-deployment.result == 'success' &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    env:
      INSTANCE_IP: ${{ needs.terraform.outputs.instance_ip }}
      DROPLET_SSH_USER: ${{ vars.DIGITALOCEAN_SSH_USER }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      BACKEND_IMAGE: ${{ needs.build-backend.outputs.image }}
      FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

    steps:
      - name: Write deployment SSH key
        env:
          INSTANCE_SSH_PRIVATE_KEY: ${{ secrets.INSTANCE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s' "$INSTANCE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"

      - name: Start application and Caddy
        run: |
          {
            printf 'SITE_DOMAIN=%s\nAPI_DOMAIN=%s\nACME_EMAIL=%s\n' "$SITE_DOMAIN" "$API_DOMAIN" "$ACME_EMAIL"
            if [ -n "$BACKEND_IMAGE" ]; then
              printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            fi
            if [ -n "$FRONTEND_IMAGE" ]; then
              printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            fi
          } | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DROPLET_SSH_USER@$INSTANCE_IP" 'umask 077; touch /opt/site/.env; while IFS= read -r line; do key=${line%%=*}; sed -i "/^${key}=/d" /opt/site/.env; printf "%s\n" "${line}" >> /opt/site/.env; done'
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            printf '%s' "$GHCR_PULL_TOKEN" \
              | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DROPLET_SSH_USER@$INSTANCE_IP" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          fi
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DROPLET_SSH_USER@$INSTANCE_IP" \
            'cd /opt/site && docker compose pull && docker compose up -d --remove-orphans'
