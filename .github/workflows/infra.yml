name: Infrastructure

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform plan or apply
    runs-on: ubuntu-latest
    outputs:
      vps_ip: ${{ steps.vps.outputs.vps_ip }}
    env:
      OVH_ENDPOINT: ${{ vars.OVH_ENDPOINT }}
      OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.S3_REGION }}
      AWS_ENDPOINT_URL_S3: ${{ vars.S3_ENDPOINT }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_vps_name: ${{ vars.OVH_VPS_NAME }}
      TF_VAR_vps_plan_code: ${{ vars.OVH_VPS_PLAN_CODE }}
      TF_VAR_vps_datacenter: ${{ vars.OVH_VPS_DATACENTER }}
      TF_VAR_vps_os: ${{ vars.OVH_VPS_OS }}
      TF_VAR_vps_image_id: ${{ vars.OVH_VPS_IMAGE_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_private_key_path: ${{ runner.temp }}/ssh/id_ed25519
      TF_VAR_ssh_user: ${{ vars.VPS_SSH_USER }}
      TF_VAR_api_subdomain: ${{ vars.API_SUBDOMAIN }}
      TF_VAR_cloudflare_proxied: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Write VPS SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"

      - name: Initialize Terraform
        working-directory: infra
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read VPS IP
        id: vps
        if: github.event_name == 'push'
        working-directory: infra
        run: echo "vps_ip=$(terraform output -raw vps_ipv4)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy application and proxy
    if: github.event_name == 'push' && needs.terraform.result == 'success'
    needs: terraform
    runs-on: ubuntu-latest
    env:
      VPS_IP: ${{ needs.terraform.outputs.vps_ip }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      BLOG_ENV: ${{ secrets.BLOG_ENV }}
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

    steps:
      - uses: actions/checkout@v4

      - name: Write deployment SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"

      - name: Install Docker and prepare deployment directory
        run: >-
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new
          "$VPS_SSH_USER@$VPS_IP"
          'sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-plugin && sudo systemctl enable --now docker && sudo install -d -o "$USER" -g "$USER" -m 0755 /opt/site'

      - name: Synchronize application files
        run: >-
          rsync -az --delete
          --exclude='.git'
          --exclude='.github'
          --exclude='node_modules'
          --exclude='target'
          --exclude='dist'
          --exclude='.astro'
          --exclude='.terraform'
          --exclude='.env'
          --exclude='**/.env'
          -e "ssh -i $RUNNER_TEMP/ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"
          ./ "$VPS_SSH_USER@$VPS_IP:/opt/site/"

      - name: Write deployment environment files
        run: |
          printf 'SITE_DOMAIN=%s\nAPI_DOMAIN=%s\nACME_EMAIL=%s\n' "$SITE_DOMAIN" "$API_DOMAIN" "$ACME_EMAIL" \
            | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new "$VPS_SSH_USER@$VPS_IP" 'umask 077 && tee /opt/site/.env > /dev/null'
          printf '%s\n' "$BLOG_ENV" \
            | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new "$VPS_SSH_USER@$VPS_IP" 'umask 077 && tee /opt/site/blog/.env > /dev/null'
          printf '%s\n' "$BACKEND_ENV" \
            | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new "$VPS_SSH_USER@$VPS_IP" 'umask 077 && tee /opt/site/backend/.env > /dev/null'

      - name: Start application and Caddy
        run: >-
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o StrictHostKeyChecking=accept-new
          "$VPS_SSH_USER@$VPS_IP"
          'cd /opt/site && docker compose up -d --build --remove-orphans'
